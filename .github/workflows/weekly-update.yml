name: Weekly KB Update

on:
  schedule:
    # Runs every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:  # Allows manual triggering

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run KB update
      env:
        NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        NOTION_KB_DATABASE_ID: ${{ secrets.NOTION_KB_DATABASE_ID }}
        NOTION_SOURCES_DATABASE_ID: ${{ secrets.NOTION_SOURCES_DATABASE_ID }}
        NOTION_QUEUE_DATABASE_ID: ${{ secrets.NOTION_QUEUE_DATABASE_ID }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        MAX_ARTICLES_PER_WEEK: 4
        RIPENESS_THRESHOLD: 60
      run: python main.py
